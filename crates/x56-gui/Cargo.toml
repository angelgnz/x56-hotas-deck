[package]
name = "x56-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "x56-deck"
path = "src/main.rs"

[[bin]]
name = "x56-gui"
path = "src/main.rs"

[dependencies]
x56-core = { path = "../x56-core" }
x56-proto = { path = "../x56-proto" }
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "system_fonts",
    "wayland",
    "x11",
    "glow",
] }
egui_plot = "0.38.0"
serde = { version = "1.0", features = ["derive"] }
libc = "0.2"
rfd = "0.18.0"
lucide-icons = "1.71.0"
log = "0.4"
env_logger = "0.11"
ksni = { version = "0.3.7", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["png"] }
x11rb = { version = "0.13" }
