<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- X56 Deck: graphite flight-deck badge with HOTAS stick and one cyan hat-switch accent -->
  <path d="M56 16 H200 L240 56 V168 L196 236 H60 L16 168 V56 Z" fill="#141415" stroke="#2a2a2e" stroke-width="3" stroke-linejoin="round"/>

  <!-- Base plate -->
  <path d="M64 204 H192 L182 176 H74 Z" fill="#232325" stroke="#a1a1a6" stroke-width="4" stroke-linejoin="round"/>
  <!-- Gimbal collar -->
  <rect x="106" y="156" width="44" height="20" rx="4" fill="#232325" stroke="#a1a1a6" stroke-width="4"/>
  <!-- Grip -->
  <path d="M110 156 L106 100 Q106 76 128 76 Q150 76 150 100 L146 156 Z" fill="#232325" stroke="#ededed" stroke-width="5" stroke-linejoin="round"/>
  <!-- Trigger -->
  <path d="M106 108 L94 120 L106 130" fill="none" stroke="#a1a1a6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top hat (single accent) -->
  <circle cx="128" cy="62" r="14" fill="#38bdf8"/>
  <circle cx="128" cy="62" r="14" fill="none" stroke="#141415" stroke-width="3"/>
</svg>
