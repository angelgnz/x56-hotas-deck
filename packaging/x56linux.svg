<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="50%" stop-color="#0f131a"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7df4ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffbd2e"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Hexagonal Shield -->
  <polygon points="128,14 232,54 232,182 128,242 24,182 24,54" 
           fill="url(#bgGrad)" stroke="#252a33" stroke-width="4" />
  <polygon points="128,24 222,60 222,176 128,230 34,176 34,60" 
           fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Tactical HUD Grid Lines -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4,6" stroke-opacity="0.25"/>
  <circle cx="128" cy="128" r="54" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="128" y1="34" x2="128" y2="222" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2,4" />
  <line x1="34" y1="128" x2="222" y2="128" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2,4" />

  <!-- HOTAS Flight Stick Vector Silhouette -->
  <!-- Stick Base / Gimbals -->
  <path d="M 88 196 L 168 196 L 158 174 L 98 174 Z" fill="#252a33" stroke="#3b494b" stroke-width="2"/>
  <rect x="112" y="156" width="32" height="18" rx="2" fill="#1b2029" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
  
  <!-- Grip Column -->
  <path d="M 116 156 Q 112 110 120 78 L 136 78 Q 144 110 140 156 Z" 
        fill="#212630" stroke="#00f0ff" stroke-width="1.5"/>

  <!-- Grip Head & Trigger Collar -->
  <path d="M 114 78 L 142 78 L 148 62 L 108 62 Z" fill="#1b2029" stroke="#7df4ff" stroke-width="1.5"/>

  <!-- Red/Amber Safety Weapon Trigger -->
  <path d="M 106 82 Q 98 96 102 108 Q 106 112 112 106 Q 114 96 116 86 Z" 
        fill="url(#amberAccent)" stroke="#ffa000" stroke-width="1" filter="url(#glow)"/>

  <!-- Top HAT Controls (Castle & Witches) -->
  <polygon points="120,54 128,44 136,54" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="112" cy="54" r="5" fill="#252a33" stroke="#00f0ff" stroke-width="1.5"/>
  <circle cx="144" cy="54" r="5" fill="#252a33" stroke="#ffbd2e" stroke-width="1.5"/>

  <!-- Flying Pinkie Paddle Accent -->
  <path d="M 100 144 Q 92 152 96 162 L 112 162" fill="none" stroke="#34f885" stroke-width="2.5" stroke-linecap="round"/>

  <!-- HUD Corner Markers -->
  <path d="M 48 76 L 48 64 L 60 64" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 208 76 L 208 64 L 196 64" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 48 180 L 48 192 L 60 192" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 208 180 L 208 192 L 196 192" fill="none" stroke="#00f0ff" stroke-width="2"/>

  <!-- Title Badge (X-56) -->
  <rect x="76" y="206" width="104" height="20" rx="3" fill="#0f131a" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="128" y="220" font-family="monospace, sans-serif" font-weight="900" font-size="12" fill="#00f0ff" text-anchor="middle" letter-spacing="2">X-56 RHINO</text>
</svg>
